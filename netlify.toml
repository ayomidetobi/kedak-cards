# Netlify build for the Kedak Card storefront.
#
# The API is proxied through this site (/api/* -> Cloud Run), so the browser only ever talks
# to one origin: auth cookies are first-party and no CORS is needed. Keep the API host in the
# proxy rule below in sync with the Cloud Run service URL.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Relative: requests go to this site and are proxied to the API below.
  VITE_API_BASE_URL = "/api/v1"
  # Google sign-in client ID: public by design (sent to every browser), so it lives here and every
  # build includes it. Must match GOOGLE_OAUTH_CLIENT_ID on the API (Cloud Run).
  VITE_GOOGLE_CLIENT_ID = "940638813442-ortde3bn9hip39jhe6sukio60u7sn96p.apps.googleusercontent.com"

# API proxy (must come before the SPA fallback).
[[redirects]]
  from = "/api/*"
  to = "https://kedak-metal-card-425305393503.europe-west1.run.app/api/:splat"
  status = 200
  force = true

# Single-page app: let Vue Router handle every other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
